<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nueva contraseña | HZ Suplementos</title>
  <meta name="robots" content="noindex" />
  <meta name="referrer" content="no-referrer" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="header scrolled">
    <div class="container header__inner">
      <a href="/" class="logo">HZ<span>SUPLEMENTOS</span></a>
    </div>
  </header>

  <main class="account container reset">
    <div class="modal__box reset__box">
      <h1 class="modal__title">NUEVA <span class="accent">CONTRASEÑA</span></h1>
      <p class="account__loading" id="resetStatus">Verificando el link...</p>

      <form class="form" id="resetForm" hidden>
        <p class="muted" id="resetHello"></p>
        <label>Nueva contraseña <small>(mínimo 8 caracteres)</small><input name="password" type="password" autocomplete="new-password" minlength="8" required /></label>
        <label>Repetila<input name="confirm" type="password" autocomplete="new-password" minlength="8" required /></label>
        <p class="form-error" role="alert"></p>
        <button class="btn btn--primary btn--block" type="submit">Guardar y entrar</button>
      </form>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
  <script>
    // El token viaja en el #hash para que no quede en logs del servidor ni en el Referer
    const token = location.hash.slice(1);
    history.replaceState(null, "", location.pathname);
    const status = $("#resetStatus");
    const form = $("#resetForm");

    function invalid(message) {
      status.innerHTML = `${esc(message)}<br /><br /><a class="btn btn--primary" href="https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent("¡Hola! Necesito un nuevo link para restablecer mi contraseña.")}" target="_blank" rel="noopener">Pedir un link nuevo</a>`;
    }

    if (!token) invalid("Falta el link de recuperación.");
    else api("auth", { method: "POST", body: { action: "reset-check", token } })
      .then(({ name, email }) => {
        status.hidden = true;
        form.hidden = false;
        $("#resetHello").textContent = `Hola ${name}, elegí una nueva contraseña para ${email}.`;
        form.elements.password.focus();
      })
      .catch((err) => invalid(err.message));

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = form.querySelector("button");
      const errorEl = form.querySelector(".form-error");
      errorEl.textContent = "";
      if (form.elements.password.value !== form.elements.confirm.value) {
        errorEl.textContent = "Las contraseñas no coinciden";
        return;
      }
      btn.disabled = true;
      try {
        await api("auth", { method: "POST", body: { action: "reset", token, password: form.elements.password.value } });
        toast("✔ Contraseña actualizada. ¡Bienvenido/a de nuevo!");
        setTimeout(() => (location.href = "/cuenta.html"), 1200);
      } catch (err) {
        errorEl.textContent = err.message;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
